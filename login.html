<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Trono sob a Tempestade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 500: '#d4a574' },
                        secondary: { 500: '#f59e0b' },
                        dark: { 900: '#2d1f10', 800: '#3d2817', 700: '#5a3d25' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-900 text-gray-100 min-h-screen font-serif flex items-center justify-center p-4">
    <main class="w-full max-w-md arcane-box p-6 space-y-4">
        <h1 class="text-2xl font-bold text-secondary-500">Entrar no servidor</h1>
        <p id="auth-status" class="text-sm text-gray-300">Use sua conta para acessar campanhas e fichas.</p>

        <form id="login-form" class="space-y-3">
            <input id="login-email" type="email" placeholder="Email" class="w-full bg-dark-700 rounded px-3 py-2 focus:outline-none" required>
            <input id="login-password" type="password" placeholder="Senha" class="w-full bg-dark-700 rounded px-3 py-2 focus:outline-none" required>
            <button type="submit" class="w-full bg-secondary-500 hover:bg-secondary-600 text-dark-900 px-3 py-2 rounded font-bold">Entrar</button>
        </form>

        <p class="text-sm text-gray-300">Não tem conta? <a href="cadastro.html" class="text-secondary-400 font-bold">Cadastrar</a></p>
    </main>

    <script src="auth-pages.js"></script>
</body>
</html>
