services:
  - type: web
    name: trono-sob-tempestade
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/app.db
    disk:
      name: trono-data
      mountPath: /var/data
      sizeGB: 1
